# ================================================================
# BizSupportManager CRM — Nginx ロケーションブロック
# Dify が使用している既存の nginx 設定ファイルの
# server { ... } ブロック内に追記してください。
# ================================================================
#
# 追記場所の例:
#   /etc/nginx/sites-available/default  (Dify が使っているファイル)
#
# 既存の Dify の設定の末尾（closing `}` の直前）に以下を貼り付ける。
# ================================================================

    # CRM アプリ (/crm/ → localhost:5000 に転送、パスプレフィックスを除去)
    location /crm/ {
        proxy_pass         http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

# ================================================================
# 設定後: sudo nginx -t && sudo systemctl reload nginx
# ================================================================
